allowBuilds:
  # Needed again: on Vercel the platform supplies sharp, but a self-hosted
  # Node server has to bring its own — without it `next start` cannot serve
  # /_next/image at all.
  sharp: true
  unrs-resolver: false

# GHSA-68fv-2mgg-jv7q: event-loop DoS in source-map-js < 1.2.2, pulled in via next>postcss.
overrides:
  source-map-js: ">=1.2.2"

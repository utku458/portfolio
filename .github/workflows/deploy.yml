# Pushing to main is the deploy.
#
# Coolify can also watch a repository itself, but that path needs a webhook
# pointing *into* the server, which means publishing the address of the Coolify
# instance. This repository is public and that address is the admin panel for
# the whole host, so the direction is reversed: GitHub calls out, and both the
# URL and the token live in repository secrets rather than in a file anyone
# can read.
#
# `workflow_dispatch` is not decoration. It makes `gh workflow run deploy.yml`
# a complete deploy from a terminal, with no browser and no dashboard login.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Two pushes in quick succession should not build the same app twice at once.
# `cancel-in-progress: false` because a deploy that has already started is
# doing real work on the server; let it finish and queue the next one behind it.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Trigger Coolify
    runs-on: ubuntu-latest
    # Nothing here reads the repository; it only makes one outbound call.
    permissions: {}

    steps:
      - name: Ask Coolify to build and deploy main
        env:
          DEPLOY_URL: ${{ secrets.COOLIFY_DEPLOY_URL }}
          DEPLOY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${DEPLOY_URL:-}" ] || [ -z "${DEPLOY_TOKEN:-}" ]; then
            echo "::error::COOLIFY_DEPLOY_URL or COOLIFY_TOKEN is not set in repository secrets."
            exit 1
          fi

          # POST, not GET: current Coolify maps `GET /api/v1/deploy` to a
          # "POST required" handler that answers 405 even with a valid token.
          #
          # --fail-with-body so a 401 or 405 ends the job instead of passing
          # silently. `set -e` would exit before the body is printed, so the
          # failure branch prints what Coolify said about it explicitly.
          http_status=$(
            curl --silent --show-error --fail-with-body \
                 --request POST \
                 --retry 3 --retry-connrefused --max-time 30 \
                 --output response.json --write-out '%{http_code}' \
                 --header "Authorization: Bearer ${DEPLOY_TOKEN}" \
                 "${DEPLOY_URL}"
          ) || {
            echo "::error::Coolify rejected the deploy request:"
            cat response.json 2>/dev/null || true
            exit 1
          }

          echo "Coolify responded ${http_status}:"
          cat response.json
          echo
          echo "The build runs on the server from here; Coolify's own"
          echo "deployment log is where its progress and result appear."
